<div id="random-post-title"></div>

<script>
	const allPosts = [
	  {%- for item in site.data.list -%}
	    { title: "{{ item.title | escape }}", link: "affirmationlist#{{ item.link }}" }{%- unless forloop.last -%},{%- endunless -%}
	  {%- endfor -%}
	];

	function getRandomPostTitle() {
	  const randomPost = allPosts[Math.floor(Math.random() * allPosts.length)];
	  return randomPost.title;
	}

	// Div’e yazdır
	document.getElementById("random-post-title").textContent = getRandomPostTitle();
</script>
